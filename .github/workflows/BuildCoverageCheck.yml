name: BuildCoverageCheck

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  vcxproj-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vcxproj and shader coverage
        run: python3 EditorAssets/Tools/CursorAI/verify_vcxproj_coverage.py
