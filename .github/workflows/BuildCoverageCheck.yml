name: BuildCoverageCheck

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  vcxproj-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vcxproj and shader coverage
        run: python3 EditorAssets/Tools/CursorAI/verify_vcxproj_coverage.py

      - name: Verify editor component registration sync
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_component_registration.py

      - name: Verify BinaryConverter mesh pipeline
        run: python3 EditorAssets/Tools/CursorAI/verify_binary_converter.py

      - name: Verify StageView tuning JSON matches C++
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_stage_view_tuning_sync.py

      - name: Verify player-friendly camera policy
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_camera_policy.py

      - name: Verify movie camera track JSON smoke
        run: python3 EditorAssets/Tools/MovieCameraTrack/verify_movie_camera_track_json.py

      - name: Verify Lighting effects ImGui wire
        run: python3 EditorAssets/Tools/CursorAI/verify_lighting_imgui_wire.py

      - name: Verify SceneGame visual apply not per DrawScene
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_game_visual_apply.py

      - name: Verify Lighting effects shared with engine
        run: python3 EditorAssets/Tools/CursorAI/verify_lighting_effects_shared.py

      - name: Verify EditorFrame lighting diagnostics panel
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_frame_lighting_panel.py

      - name: Verify editor runtime functional view draw
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_scene_view_functional.py

      - name: Verify SceneBuildUp launch policy
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_launch_policy.py

      - name: Verify audio streaming debug log
        run: python3 EditorAssets/Tools/CursorAI/verify_audio_streaming_debug_log.py

      - name: Verify streaming debug menu on BuildUp
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_frame_streaming_menu.py

      - name: Verify Release startup BuildUp launch
        run: python3 EditorAssets/Tools/CursorAI/verify_entity_editor_release_startup_launch.py

      - name: Verify EditorScenePlayRequest Path wiring
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_scene_play_request_path.py

      - name: Verify EditorScenePlayRequest Clear wiring
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_scene_play_request_clear.py

      - name: Verify Set then BuildUp queue
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_scene_play_request_buildup.py

      - name: Verify scene play via BuildUp route
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_buildup_play.py

      - name: Verify F2 feature test BuildUp hotkey
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_f2_feature_scene.py

      - name: Verify LoopTick13Demo feature verification canonical scene
        run: python3 EditorAssets/Tools/CursorAI/verify_loop_tick13_demo_feature_verification_canonical.py

      - name: Verify combat_bounds_sandbox debug play area launch
        run: python3 EditorAssets/Tools/CursorAI/verify_combat_bounds_sandbox_debug_play_area.py

      - name: Verify in-editor play Runtime tab focus only
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_runtime_tab_focus.py

      - name: Verify editor preview camera from CmpCamera
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_preview_camera.py

      - name: Verify Runtime tab keeps CmpCamera (no stage override)
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_runtime_stage_camera.py

      - name: Verify in-editor play is Runtime tab only
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_runtime_tab_only_play.py

      - name: Verify Edit hover camera via CmpCamera
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_edit_hover_camera.py

      - name: Verify scene view RT camera bind via ActiveCameraSystem
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_scene_view_rt_camera.py

      - name: Verify preview draw uses scene document entity draw
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_draw_preview_roots.py

      - name: Verify ExitScene releases preview and play Ui flags
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_entity_editor_exit_preview_release.py

      - name: Verify frame delta time debug ImGui
        run: python3 EditorAssets/Tools/CursorAI/verify_frame_delta_time_debug_imgui.py

      - name: Verify DebugPlayArea scaffold from editor
        run: python3 EditorAssets/Tools/CursorAI/verify_scaffold_play_area_editor.py

      - name: Verify scaffold post-generate guidance
        run: python3 EditorAssets/Tools/CursorAI/verify_scaffold_play_area_post_generate_hint.py

      - name: Verify scaffold personalizes instances not only sceneName
        run: python3 EditorAssets/Tools/CursorAI/verify_scaffold_play_area_personalize.py

      - name: Verify CommandScene development boot resolution
        run: python3 EditorAssets/Tools/CursorAI/verify_command_scene_development_boot.py

      - name: Verify CommandScene release boot falls back to Title
        run: python3 EditorAssets/Tools/CursorAI/verify_command_scene_release_boot.py

      - name: Verify CommandScene boot path gate skips TryLoad before Launch
        run: python3 EditorAssets/Tools/CursorAI/verify_command_scene_launch_no_tryload.py

      - name: Verify CommandScene initial Enter after sceneNow reconcile
        run: python3 EditorAssets/Tools/CursorAI/verify_command_scene_enter_after_scene_now.py

      - name: Verify SceneBuildUp F1 return when returnScene is null
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_return_scene.py

      - name: Verify SceneBuildUp Draw skips EditorFrame workbench
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_draw_skips_editor_frame.py

      - name: Verify SceneBuildUp isolates EditorSceneRuntime include
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_no_editor_scene_runtime.py

      - name: Verify SceneBuildUp load failure spawns no dummy entity
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_load_failure_no_dummy_entity.py

      - name: Verify SceneBuildUp updates cameraRig entities
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_camera_rig_update.py

      - name: Verify SceneBuildUp Enter calls SetupStageViewCamera after load
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_enter_setup_stage_camera.py

      - name: Verify SceneBuildUp runtime subview skips SetupStageViewCamera
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_draw_runtime_camera.py

      - name: Verify SceneBuildUp StageView lock is not hardcoded true
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_stage_camera_lock_toggle.py

      - name: Verify SceneBuildUp F1 works while transition blocks Update
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_f1_during_fade.py

      - name: Verify SceneBuildUp merges tagCatalog after JSON load
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_tag_catalog_merge.py

      - name: Verify SceneBuildUp inherits AllowDebugCameraControl false
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_allow_debug_camera_contract.py

      - name: Verify SceneBuildUp ExitScene restores SceneView Edit tab
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_exit_scene_view_tab.py

      - name: Verify SceneBuildUp applies runtime lighting on enter only
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_runtime_lighting_enter_only.py

      - name: Verify SceneBuildUp runtime view shows JSON path in header
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_runtime_view_window_text.py

      - name: Verify SceneBuildUp child entities use document draw contract
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_child_instance_draw.py

      - name: Verify SceneBuildUp does not force HalfLambert each draw
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_no_half_lambert_per_draw.py

      - name: Verify SceneBuildUp EnterScene does not lock Runtime tab
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_enter_scene_no_runtime_tab_lock.py

      - name: Verify SceneBuildUp reports missing primary camera
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_camera_null_feedback.py

      - name: Verify SceneBuildUp ctor resolves display name from JSON
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_display_name_resolve.py

      - name: Verify SceneBuildUp draws ChangeScene only when active
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_build_up_change_scene_draw_when_active.py
