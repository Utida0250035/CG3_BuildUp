name: BuildCoverageCheck

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  vcxproj-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloud Linux Development preflight procedure
        run: python3 EditorAssets/Tools/CursorAI/verify_cloud_dev_build.py

      - name: Verify vcxproj and shader coverage
        run: python3 EditorAssets/Tools/CursorAI/verify_vcxproj_coverage.py

      - name: Verify editor component registration sync
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_component_registration.py

      - name: Verify component settings copy paste
        run: python3 EditorAssets/Tools/CursorAI/verify_entity_editor_component_settings_copy_paste.py

      - name: Verify CmpCamera default params on add
        run: python3 EditorAssets/Tools/CursorAI/verify_entity_editor_cmp_camera_default_params.py

      - name: Verify ComponentSlot from_json params merge
        run: python3 EditorAssets/Tools/CursorAI/verify_entity_editor_from_json_params_merge.py

      - name: Verify duplicate instance Ctrl+D shortcut
        run: python3 EditorAssets/Tools/CursorAI/verify_entity_editor_duplicate_instance_shortcut.py

      - name: Verify light post adjust menu window
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_entity_workbench_light_post_menu.py

      - name: Verify BinaryConverter mesh pipeline
        run: python3 EditorAssets/Tools/CursorAI/verify_binary_converter.py

      - name: Verify StageView tuning JSON matches C++
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_stage_view_tuning_sync.py

      - name: Verify player-friendly camera policy
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_camera_policy.py

      - name: Verify stage view camera tuning editor preview
        run: python3 EditorAssets/Tools/CursorAI/verify_stage_view_camera_tuning_editor_preview.py

      - name: Verify movie camera track JSON smoke
        run: python3 EditorAssets/Tools/MovieCameraTrack/verify_movie_camera_track_json.py

      - name: Verify Lighting effects ImGui wire
        run: python3 EditorAssets/Tools/CursorAI/verify_lighting_imgui_wire.py

      - name: Verify SceneGame visual apply not per DrawScene
        run: python3 EditorAssets/Tools/CursorAI/verify_scene_game_visual_apply.py

      - name: Verify visual lighting profile JSON canonical pair
        run: python3 EditorAssets/Tools/CursorAI/verify_visual_lighting_profile_json.py

      - name: Verify DirectionalShadow apply diagnostics
        run: python3 EditorAssets/Tools/CursorAI/verify_directional_shadow_apply_diagnostics.py

      - name: Verify subsystem frame profiler wiring
        run: python3 EditorAssets/Tools/CursorAI/verify_subsystem_frame_profiler.py

      - name: Verify development opt profile measurement procedure
        run: python3 EditorAssets/Tools/CursorAI/verify_development_opt_profile.py

      - name: Verify compile and Release exclusion config matrix
