name: BuildCoverageCheck

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  vcxproj-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vcxproj and shader coverage
        run: python3 EditorAssets/Tools/CursorAI/verify_vcxproj_coverage.py

      - name: Verify editor component registration sync
        run: python3 EditorAssets/Tools/CursorAI/verify_editor_component_registration.py

      - name: Verify BinaryConverter mesh pipeline
        run: python3 EditorAssets/Tools/CursorAI/verify_binary_converter.py

      - name: Verify StageView tuning JSON matches C++
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_stage_view_tuning_sync.py

      - name: Verify player-friendly camera policy
        run: python3 EditorAssets/Tools/StageViewCameraTuning/verify_camera_policy.py

      - name: Verify movie camera track JSON smoke
        run: python3 EditorAssets/Tools/MovieCameraTrack/verify_movie_camera_track_json.py

      - name: Verify Lighting effects ImGui wire
        run: python3 EditorAssets/Tools/CursorAI/verify_lighting_imgui_wire.py
