      - name: Verify buildDevelopment.cmd matches CI Development entry
        run: python3 EditorAssets/Tools/CursorAI/verify_build_development_ci_parity.py

      - name: Verify buildDevelopment NuGet restore step
        run: python3 EditorAssets/Tools/CursorAI/verify_build_development_nuget_restore.py

      - name: Verify Release startup smoke CI wiring
        run: python3 EditorAssets/Tools/CursorAI/verify_release_startup_smoke_ci.py

      - name: Verify Release startup smoke CLI
        run: python3 EditorAssets/Tools/CursorAI/verify_release_startup_smoke_cli.py

      - name: Verify Release smoke runbook documented
        run: python3 EditorAssets/Tools/CursorAI/verify_ship_smoke_runbook.py

      - name: Verify runtime asset pack paths
