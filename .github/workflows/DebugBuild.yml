name: DebugBuild

on:
  push:
    branches:
      - master

env:
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Copy packages to Project directory
        run: |
          if (Test-Path packages) {
              Copy-Item -Recurse -Force packages Project/packages
          }
        shell: pwsh

      - name: Build Core
        run: msbuild Project/CG2_BuildUp.slnx /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
