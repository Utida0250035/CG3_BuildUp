name: DebugBuild

on:
  push:
    branches:
      - master

env:
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet Packages
        run: nuget restore Project/CG2_BuildUp.vcxproj

      - name: Build
        run: msbuild Project/CG2_BuildUp.slnx /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
